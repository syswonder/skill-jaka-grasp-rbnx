manifestVersion: 1

build: bash scripts/build.sh

start: bash scripts/start.sh

package:
  name: "robonix.skill.jaka_grasp"
  version: 0.1.0
  description: "JAKA Mini grab/release/home/place + camera-driven pick skill for both the TG-9801 gripper and the LinkerHand O6 hand bodies; includes fixed-pose pick-and-place (固定抓取)."
  tags:
    - skill
    - jaka
    - manipulation
    - grasp
  maintainers:
    - Felix <xi.lifeng@qq.com>
  license: Apache-2.0

capabilities:
  - name: robonix/skill/jaka/grab
    transport: mcp
    path: capabilities/grab.v1.toml
  - name: robonix/skill/jaka/release
    transport: mcp
    path: capabilities/release.v1.toml
  - name: robonix/skill/jaka/home
    transport: mcp
    path: capabilities/home.v1.toml
  - name: robonix/skill/jaka/place
    transport: mcp
    path: capabilities/place.v1.toml
  - name: robonix/skill/jaka/fixed_grasp
    transport: mcp
    path: capabilities/fixed_grasp.v1.toml
  - name: robonix/skill/jaka/pick
    transport: mcp
    path: capabilities/pick.v1.toml

depends: []
