# robonix/skill/jaka/egg — fixed-pose egg pick-and-place (demo).
#
# User-invocable atomic intent: "抓鸡蛋 / 拾蛋 / egg". Picks an egg up at
# the configured `egg_grasp_pose` and sets it down at the configured
# `egg_place_pose` — both FIXED deploy-config values, no camera, no
# arguments. The grasp half reuses grab's segment (open -> hover ->
# descend -> close -> settle -> lift[non-fatal]); the place half is hover
# -> descend -> open -> settle -> lift (non-fatal).
#
# EGGS ARE FRAGILE: grip force is jaka_arm's one-time `gripper_force`
# config (0-100) — LOWER it on-site and verify on a real egg before
# running this demo. Arm speeds likewise come from jaka_arm
# (joint_speed_rad_s / linear_speed_mm_s).
#
# Both poses must be calibrated in the deploy config; until then `egg`
# reports unavailable (grab/release/pick unaffected). Motion goes through
# jaka_arm's pos_command / joint_command contracts via atlas.
#
# Synchronous. Request has NO fields — the tool takes no arguments ({}).
[contract]
id      = "robonix/skill/jaka/egg"
version = "1"
kind    = "skill"
idl     = "jaka/srv/Egg.srv"

[mode]
type = "rpc"
