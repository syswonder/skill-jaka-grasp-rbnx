# robonix/skill/jaka/place — set a held object down.
#
# User-invocable atomic intent: "place / put it down / 放下 / 放置". Where
# is config-driven: with no `place_pose` calibrated (default) the object
# is set down IN PLACE (原地放下) — the arm's current XY at the calibrated
# desktop_height, orientation grasp_rpy; with a `place_pose` set in the
# deploy manifest's `skill: - name: jaka` config block, the object is
# carried there. Either way the mirror of grab: hover above the target
# (z + travel_offset), descend, open the gripper, settle, lift back to
# hover. The gripper keeps holding until the bottom — `release` is the
# zero-motion let-go-here tool. A failed lift is non-fatal (the object is
# already released). Motion goes through jaka_arm's pos_command /
# joint_command contracts via atlas.
#
# Synchronous. Request has NO fields — the tool takes no arguments ({}).
[contract]
id      = "robonix/skill/jaka/place"
version = "1"
kind    = "skill"
idl     = "jaka/srv/Place.srv"

[mode]
type = "rpc"
